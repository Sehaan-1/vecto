name: Bench

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Turbo
        run: npm install -g turbo@2

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Run benchmarks report
        run: go run ./benchmarks/report -out bench-results -external -label "ubuntu-latest CI"

      - name: Append results to job summary
        run: cat bench-results/results.md >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
          retention-days: 30
