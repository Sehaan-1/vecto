<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vecto - DAG Task Runner & Build Cache in Go</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A language-agnostic DAG task runner and content-addressed build cache in Go.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #2563eb;
      --sidebar-width: 18rem;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0d1117;
        color: #c9d1d9;
      }
      .sidebar {
        background-color: #161b22;
        border-right: 1px solid #30363d;
        color: #c9d1d9;
      }
      .sidebar a {
        color: #8b949e;
      }
      .sidebar a:hover, .sidebar li.active > a {
        color: #58a6ff;
      }
      .content {
        background-color: #0d1117;
      }
      .markdown-section pre {
        background-color: #161b22 !important;
        border: 1px solid #30363d;
      }
      .markdown-section code {
        background-color: #161b22;
        color: #e6edf3;
      }
      .markdown-section table th, .markdown-section table td {
        border-color: #30363d;
      }
      .markdown-section table tr:nth-child(2n) {
        background-color: #161b22;
      }
    }
    .mermaid {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>
  <div id="app">Loading Vecto documentation...</div>
  <script>
    window.$docsify = {
      name: 'Vecto',
      repo: 'https://github.com/Sehaan-1/vecto',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>

  <!-- Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>

  <!-- Mermaid.js -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    window.$docsify.plugins = [].concat(function(hook, vm) {
      hook.doneEach(function() {
        mermaid.run({
          nodes: document.querySelectorAll('.mermaid')
        });
      });
    }, window.$docsify.plugins || []);
  </script>
</body>
</html>
