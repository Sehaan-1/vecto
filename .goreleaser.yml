# GoReleaser config for vecto (ADR-0010).
# Tag-triggered releases: git tag v0.1.0 && git push origin v0.1.0
version: 2

project_name: vecto

builds:
  - main: ./cmd/vecto
    binary: vecto
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"
